name: PBUI CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@hyperslop-systems"

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.50.0

      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: go test ./...
      - run: buf lint
      - name: Check protobuf compatibility
        run: |
          if git cat-file -e origin/main:proto 2>/dev/null; then
            # A PR checkout is a detached merge ref with no LOCAL branch named
            # main — only origin/main exists — so buf must compare against the
            # remote-tracking ref, not a branch it cannot find.
            buf breaking --against '.git#ref=origin/main'
          else
            echo "No protobuf baseline exists on main yet; lint and drift checks still apply."
          fi
      - run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
      - run: buf generate
      - name: Verify generated protocol is current
        run: git diff --exit-code -- gen/go packages/workbench-protocol/src/generated
      - name: Check frontend (same gate as Lefthook pre-push)
        run: make frontend-check
      - run: pnpm --workspace-root run build-storybook
      - run: pnpm --workspace-root run consumer:smoke
      - run: mkdir -p .artifacts && pnpm pack --pack-destination .artifacts
      - run: pnpm --filter @hyperslop-systems/datalab-ui build-storybook
      - run: pnpm --filter @hyperslop-systems/datalab-ui consumer:smoke
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm --filter @hyperslop-systems/datalab-ui pack --pack-destination ../../.artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: hyperslop-ui-packages
          path: .artifacts/*.tgz
