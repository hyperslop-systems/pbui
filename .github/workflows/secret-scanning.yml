name: Secret Scanning

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog Secret Scan
    if: ${{ github.event_name != 'push' || github.event.before != github.sha }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
          head: ${{ github.event_name == 'push' && github.sha || github.event.pull_request.head.sha }}
