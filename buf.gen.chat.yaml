version: v2
# Chat protocol: Go + the @hyperslop-systems/pbui-chat TS package.
# Invoked with `--path proto/hyperslop/pbui/chat` (see Makefile).
plugins:
  - local: protoc-gen-go
    out: gen/go
    opt:
      - paths=source_relative
  - local: packages/workbench-protocol/node_modules/.bin/protoc-gen-es
    out: packages/pbui-chat/src/generated
    opt:
      - target=ts
      - import_extension=none
