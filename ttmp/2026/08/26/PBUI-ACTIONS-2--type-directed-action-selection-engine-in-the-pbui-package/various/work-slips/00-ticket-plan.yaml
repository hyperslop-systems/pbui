almanach_studio_version: 1
theme: brutalist
paperWidth: 384
bodyScale: 1
feedLines: 8
blocks:
- id: head
  type: row
  data:
    cols:
    - w: 1fr
      text: PBUI-ACTIONS-2
      preset: micro
    - w: 1fr
      text: PLAN
      preset: micro
      align: right
- id: r1
  type: rule
  data:
    weight: heavy
- id: gap1
  type: space
  data:
    size: s
- id: title
  type: text
  data:
    text: Action Selection Kernel
    preset: h1
    lines: 3
- id: gap2
  type: space
  data:
    size: s
- id: summary
  type: text
  data:
    text: Replace the exact descriptor actions() lookup with a pure resolver. Keep gestures, focus, accept, and verb routers
      untouched.
    preset: body
- id: gap3
  type: space
  data:
    size: m
- id: planhead
  type: text
  data:
    text: PLAN
    preset: h2
- id: plan
  type: checks
  data:
    items:
    - P0 goldens + stable adapter ids
    - P1 pure action kernel
    - P2 provider + legacy adapter
    - P3 workbench + datalab rules
    - P4 chat + sandbox families
    - P5 inheritance + scopes
    - P6 typed translators
    - P7 cleanup + stabilize
- id: r2
  type: rule
  data:
    weight: hair
- id: facts
  type: kv
  data:
    items:
    - - PHASES
      - '8'
    - - NEXT
      - P0 goldens + stable adapter ids
- id: r3
  type: rule
  data:
    weight: hair
- id: decide
  type: row
  data:
    cols:
    - w: 1fr
      text: SCAN FOR REF
      preset: caption
    - w: 120
      blocks:
      - id: qr
        type: qr
        data:
          value: https://github.com/hyperslop-systems/pbui
          size: 110
