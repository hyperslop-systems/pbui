syntax = "proto3";

package hyperslop.pbui.chat.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/hyperslop-systems/pbui/gen/go/hyperslop/pbui/chat/v1;chatv1";

// Reference is a presentation reference as it travels between the agent
// backend and the browser: the presentation type, the stable id the model may
// name, the resolved value (absent while unresolved), and its provenance.
message Reference {
  string type = 1;
  string id = 2;
  google.protobuf.Struct value = 3;
  Provenance provenance = 4;
}

// Provenance records where a reference was minted.
message Provenance {
  string message_id = 1;
  string tool_call_id = 2;
  string widget_id = 3;
}

// Actor distinguishes verbs performed by a person from verbs the router
// performed on the agent's behalf.
enum Actor {
  ACTOR_UNSPECIFIED = 0;
  ACTOR_HUMAN = 1;
  ACTOR_AGENT = 2;
}

// VerbPerformedCommand is submitted by the browser after the verb router
// performed (or rejected) a presentation verb.
message VerbPerformedCommand {
  string client_seq = 1;
  Actor actor = 2;
  google.protobuf.Struct verb = 3;
  Reference target = 4;
  string outcome = 5;
  string effect_id = 6;
  string invocation_key = 7;
  string approval_id = 8;
}

// EffectEnvelope correlates one validated agent invocation with the exact
// product effect, approval, revisions, and outcome it caused.
message EffectEnvelope {
  string effect_id = 1;
  string invocation_key = 2;
  Actor actor = 3;
  string conversation_id = 4;
  string effect_kind = 5;
  string effect_scope = 6;
  google.protobuf.Value canonical_input = 7;
  string input_digest = 8;
  repeated string target_ids = 9;
  repeated string reference_keys = 10;
  string approval_id = 11;
  string before_revision = 12;
  string after_revision = 13;
  string outcome = 14;
  google.protobuf.Timestamp occurred_at = 15;
}

message EffectPerformedCommand {
  EffectEnvelope effect = 1;
}

// TraceEntry is the backend event and the durable timeline entity recording
// one performed verb. The sequence number is assigned server-side per session.
message TraceEntry {
  uint64 seq = 1;
  Actor actor = 2;
  google.protobuf.Struct verb = 3;
  Reference target = 4;
  string outcome = 5;
  google.protobuf.Timestamp at = 6;
  string client_seq = 7;
  EffectEnvelope effect = 8;
  string effect_id = 9;
  string invocation_key = 10;
  string approval_id = 11;
}

// WidgetRequestedEvent is the geppetto-side event a backend tool publishes
// when the model asks for a widget document; the chat plugin turns it into
// widget-instance events. It is a named message so the schema policy applies
// to it as well, even though it does not travel to the browser.
message WidgetRequestedEvent {
  string widget_id = 1;
  string parent_message_id = 2;
  google.protobuf.Struct document = 3;
}
