pre-commit:
  commands:
    go-quality:
      glob: "*.go"
      run: make fmt-check lint logcopter-check glazed-lint
    go-test:
      glob: "*.go"
      run: make test
  parallel: true

pre-push:
  commands:
    checks:
      # Generate/check protocol before Go and TS read it; frontend-check is
      # the same lint/typecheck/test/build gate used by GitHub CI.
      run: make protocol-check && make ci-check && make frontend-check
